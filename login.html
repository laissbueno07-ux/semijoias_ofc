<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — Lume</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <button class="menu-toggle" id="menuToggle" aria-label="Abrir menu">☰</button>
      <nav class="nav-left">
        <a href="index.html#colecao">Coleção</a>
        <a href="index.html#sobre">Sobre</a>
      </nav>
      <a href="index.html" class="logo">Lume</a>
      <nav class="nav-right">
        <a href="guia-de-cuidados.html">Guia de cuidados</a>
        <a href="favoritos.html" class="icon-link" aria-label="Favoritos">♥</a>
        <span id="authArea" class="auth-area"></span>
      </nav>
    </div>
  </header>

  <section class="auth-section">
    <div class="auth-card">
      <h2 class="section-title">Entrar</h2>
      <p class="section-sub">Acesse sua conta para ver favoritos e o histórico de compras.</p>

      <form id="loginForm" class="auth-form">
        <label>
          E-mail
          <input type="email" name="email" required>
        </label>
        <label>
          Senha
          <input type="password" name="password" required>
        </label>
        <p class="form-error" id="formError" hidden></p>
        <button type="submit" class="btn btn-primary btn-full">Entrar</button>
      </form>

      <p class="auth-switch">
        Ainda não tem conta?
        <a href="cadastro.html">Cadastre-se</a>
      </p>
    </div>
  </section>

  <footer class="site-footer">
    <p class="logo footer-logo">Lume</p>
    <p>Atendimento: contato@lume.com.br</p>
    <p class="fine-print">© 2026 Lume. Todos os direitos reservados.</p>
  </footer>

  <script src="js/auth-ui.js"></script>
  <script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById("formError");
      errorEl.hidden = true;

      const form = new FormData(e.target);
      const email = form.get("email");
      const password = form.get("password");

      try {
        const response = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        });

        const data = await response.json();

        if (!response.ok) {
          errorEl.textContent = data.error || "Erro ao fazer login";
          errorEl.hidden = false;
          return;
        }

        // Login realizado com sucesso
        window.location.href = "perfil.html";
      } catch (err) {
        errorEl.textContent = "Erro ao conectar com o servidor. Tente novamente.";
        errorEl.hidden = false;
        console.error(err);
      }
    });
  </script>
</body>
</html>
