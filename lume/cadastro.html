<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar conta — Lume</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <button class="menu-toggle" id="menuToggle" aria-label="Abrir menu">☰</button>
      <nav class="nav-left">
        <a href="index.html#colecao">Coleção</a>
        <a href="index.html#sobre">Sobre</a>
      </nav>
      <a href="index.html" class="logo">Lume</a>
      <nav class="nav-right">
        <a href="guia-de-cuidados.html">Guia de cuidados</a>
        <a href="favoritos.html" class="icon-link" aria-label="Favoritos">♥</a>
        <span id="authArea" class="auth-area"></span>
      </nav>
    </div>
  </header>

  <section class="auth-section">
    <div class="auth-card">
      <h2 class="section-title">Criar conta</h2>
      <p class="section-sub">Guarde seus favoritos e acompanhe suas compras.</p>

      <form id="cadastroForm" class="auth-form">
        <label>
          Nome
          <input type="text" name="name" id="cadastroNome" required>
        </label>
        <label>
          E-mail
          <input type="email" name="email" id="cadastroEmail" required>
        </label>
        <label>
          Senha (mínimo 6 caracteres)
          <input type="password" name="password" id="cadastroSenha" minlength="6" required>
        </label>
        <p class="form-error" id="formError" hidden></p>
        <button type="submit" class="btn btn-primary btn-full">Criar conta</button>
      </form>

      <p class="auth-switch">Já tem conta? <a href="login.html">Entrar</a></p>
    </div>
  </section>

  <footer class="site-footer">
    <p class="logo footer-logo">Lume</p>
    <p>Atendimento: contato@lume.com.br</p>
    <p class="fine-print">© 2026 Lume. Todos os direitos reservados.</p>
  </footer>

  <script src="js/auth-ui.js"></script>
  <script>
    document.getElementById("cadastroForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById("formError");
      errorEl.hidden = true;

      const name = document.getElementById("cadastroNome").value.trim();
      const email = document.getElementById("cadastroEmail").value.trim();
      const password = document.getElementById("cadastroSenha").value;

      console.log("📝 Tentando cadastrar:", { name, email });

      try {
        const response = await fetch("/api/cadastro", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, email, password }),
        });

        const data = await response.json();
        console.log("📦 Resposta:", data);

        if (!response.ok) {
          errorEl.textContent = data.error || "Erro ao criar conta";
          errorEl.hidden = false;
          return;
        }

        alert("✅ Conta criada com sucesso! Você já está logado.");
        window.location.href = "perfil.html";
      } catch (err) {
        console.error("❌ Erro:", err);
        errorEl.textContent = "Erro ao conectar com o servidor. Tente novamente.";
        errorEl.hidden = false;
      }
    });
  </script>
</body>
</html>
