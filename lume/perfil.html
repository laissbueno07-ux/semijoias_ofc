<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Perfil — Lume</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <button class="menu-toggle" id="menuToggle" aria-label="Abrir menu">☰</button>
      <nav class="nav-left">
        <a href="index.html#colecao">Coleção</a>
        <a href="index.html#sobre">Sobre</a>
      </nav>
      <a href="index.html" class="logo">Lume</a>
      <nav class="nav-right">
        <a href="guia-de-cuidados.html">Guia de cuidados</a>
        <a href="favoritos.html" class="icon-link" aria-label="Favoritos">♥</a>
        <span id="authArea" class="auth-area"></span>
      </nav>
    </div>
  </header>

  <section class="auth-section">
    <div class="auth-card">
      <h2 class="section-title">Meu Perfil</h2>
      <p class="section-sub">Acompanhe suas informações e histórico.</p>

      <div id="profileDetails" style="margin-top: 20px; text-align: left;">
        <p><strong>Nome:</strong> <span id="userName">Carregando...</span></p>
        <p><strong>E-mail:</strong> <span id="userEmail">Carregando...</span></p>
      </div>

      <h3 style="margin-top: 30px; font-weight: 500; color: var(--wine);">Meus Pedidos</h3>
      <div id="ordersList" style="margin-top: 10px;">
        <p style="color: #888;">Carregando pedidos...</p>
      </div>

      <button id="logoutBtnProfile" class="btn btn-primary btn-full" style="margin-top: 20px;">Sair da conta</button>
    </div>
  </section>

  <footer class="site-footer">
    <p class="logo footer-logo">Lume</p>
    <p>Atendimento: contato@lume.com.br</p>
    <p class="fine-print">© 2026 Lume. Todos os direitos reservados.</p>
  </footer>

  <script src="js/products.js"></script>
  <script src="js/auth-ui.js"></script>
  <script>
    const formatBRL = (value) =>
      value.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });

    async function carregarPerfil() {
      try {
        console.log("🔍 Carregando perfil...");
        
        // 1. Busca os dados do usuário
        const meRes = await fetch("/api/me");
        const meData = await meRes.json();
        
        console.log("📦 Dados do usuário:", meData);

        if (!meData.user) {
          alert("Você precisa estar logado para acessar o perfil.");
          window.location.href = "login.html";
          return;
        }

        // 2. Preenche os dados do usuário
        document.getElementById("userName").textContent = meData.user.name;
        document.getElementById("userEmail").textContent = meData.user.email;

        // 3. Busca os pedidos
        const ordersRes = await fetch("/api/pedidos");
        const ordersData = await ordersRes.json();
        
        console.log("📦 Pedidos:", ordersData);

        const ordersList = document.getElementById("ordersList");
        
        if (!ordersData.pedidos || ordersData.pedidos.length === 0) {
          ordersList.innerHTML = `<p style="color: #888;">Você ainda não fez nenhum pedido.</p>`;
          return;
        }

        // 4. Renderiza os pedidos
        ordersList.innerHTML = ordersData.pedidos
          .map((order) => `
            <div style="
              background: var(--cream);
              padding: 15px;
              border-radius: 8px;
              margin-bottom: 12px;
              border-left: 4px solid var(--gold);
            ">
              <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                <strong style="color: var(--wine);">Pedido #${order.id}</strong>
                <span style="
                  background: ${order.status === 'aprovado' ? '#4CAF50' : '#FF9800'};
                  color: white;
                  padding: 2px 12px;
                  border-radius: 12px;
                  font-size: 12px;
                  text-transform: uppercase;
                ">${order.status}</span>
              </div>
              <div style="font-size: 14px; color: #555;">
                ${order.items.map(item => 
                  `${item.name} (${item.qty}x)`
                ).join(', ')}
              </div>
              <div style="margin-top: 8px; font-weight: 500; color: var(--wine);">
                Total: ${formatBRL(order.total)}
              </div>
              <div style="font-size: 12px; color: #999; margin-top: 4px;">
                ${new Date(order.createdAt).toLocaleDateString('pt-BR', {
                  day: '2-digit',
                  month: '2-digit',
                  year: 'numeric',
                  hour: '2-digit',
                  minute: '2-digit'
                })}
              </div>
            </div>
          `)
          .join("");

      } catch (err) {
        console.error("❌ Erro ao carregar perfil:", err);
        document.getElementById("userName").textContent = "Erro ao carregar";
        document.getElementById("userEmail").textContent = "Erro ao carregar";
        document.getElementById("ordersList").innerHTML = 
          `<p style="color: #e74c3c;">Erro ao carregar pedidos. Tente novamente.</p>`;
      }
    }

    // Botão de logout
    document.getElementById("logoutBtnProfile").addEventListener("click", async () => {
      try {
        await fetch("/api/logout", { method: "POST" });
        window.location.href = "index.html";
      } catch (err) {
        console.error("Erro ao sair:", err);
      }
    });

    // Carrega o perfil quando a página abrir
    document.addEventListener("DOMContentLoaded", carregarPerfil);
  </script>
</body>
</html>
